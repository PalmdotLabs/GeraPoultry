project_id = "poultry-farm-feed-mill"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["extensions"]
max_rows = 1000
auto_expose_new_tables = false

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.seed]
enabled = false

[realtime]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1:54321"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = [
  "http://127.0.0.1:3000/**",
  "http://localhost:3000/**",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.rate_limit]
email_sent = 100
sms_sent = 10
anonymous_users = 30
token_refresh = 150
token_verifications = 15
sign_in_sign_ups = 30

[auth.email]
double_confirm_changes = true
enable_confirmations = false
secure_password_change = true
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[auth.sms]
enabled = false
enable_confirmations = false

[edge_runtime]
enabled = false
policy = "oneshot"
inspector_port = 8083

[analytics]
enabled = false
port = 54327
